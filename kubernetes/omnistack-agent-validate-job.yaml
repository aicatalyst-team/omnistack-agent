apiVersion: batch/v1
kind: Job
metadata:
  name: omnistack-agent-validate
  namespace: poc-omnistack-agent
  labels:
    app: omnistack-agent
    autopoc.io/project: omnistack-agent
    autopoc.io/scenario: validate-adapters
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    spec:
      containers:
        - name: omnistack-agent
          image: quay.io/aicatalyst/omnistack-agent:latest
          imagePullPolicy: Always
          command: ["node"]
          args: ["scripts/validate.mjs"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Never
